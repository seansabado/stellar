outputFiles:
  serverApp:
    include:
      - public/**

runConfig:
  maxInstances: 20
  memoryMiB: 1024

env:
  - variable: STELLAR_PUBLIC_TESTNET
    value: "GBK4EPWBVRS5KLW6AR2QTPFD5ZUJIVCP3KTEY2CIF6QOCAYY4SDZO6WC"
    availability:
      - RUNTIME
  - variable: HORIZON_URL_TESTNET
    value: "https://horizon-testnet.stellar.org"
    availability:
      - RUNTIME
  - variable: STELLAR_PUBLIC_MAINNET
    value: "GBXEISJ7QAWSS6Z4MSHYGCVOLKTAV6GAHYNOYUOST2HYUDOSRDCNGDLD"
    availability:
      - RUNTIME
  - variable: STELLAR_SECRET_DEMO_CUSTOMER
    secret: STELLAR_SECRET_DEMO_CUSTOMER
    availability:
      - RUNTIME
  - variable: STELLAR_SECRET_MAINNET
    secret: STELLAR_SECRET_DEMO_CUSTOMER
    availability:
      - RUNTIME
  - variable: HORIZON_URL_MAINNET
    value: "https://horizon.stellar.org"
    availability:
      - RUNTIME
  - variable: SOROBAN_CONTRACT_ID
    value: "CANEW7EC3W6BMVDJQNRDVTUZZ32QWIY5LNOEGWPVRWYF7LEJUUWEYWKB"
    availability:
      - RUNTIME
  - variable: SOROBAN_RPC_URL
    value: "https://mainnet.sorobanrpc.com"
    availability:
      - RUNTIME
  - variable: STELLAR_NETWORK
    value: "mainnet"
    availability:
      - RUNTIME
